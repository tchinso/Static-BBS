<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>삭제 검증</title>
</head>
<body>
  <button id="run" type="button">스토리지 삭제 검증 실행</button>
  <p id="result" role="status"></p>
  <script>
    document.querySelector('#run').addEventListener('click', async () => {
      const button = document.querySelector('#run');
      const result = document.querySelector('#result');
      button.disabled = true;
      result.textContent = '검증 중…';
      try {
        const response = await fetch('/api/internal/verify-storage-cleanup', { method: 'POST' });
        const body = await response.json();
        result.textContent = response.ok && body.verified ? '검증 통과' : '검증 실패';
      } catch {
        result.textContent = '검증 실패';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
