<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="냥캣메모 로그인 확인">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>로그인 계속하기 · 냥캣메모</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { align-items: center; background: #17151b; color: #f8f5fb; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
    main { background: #26212b; border: 1px solid #4d4356; border-radius: 18px; box-shadow: 0 18px 50px #0008; max-width: 440px; padding: 32px; text-align: center; width: 100%; }
    .mark { background: #f4a8c8; border-radius: 999px; color: #2a1723; display: inline-grid; font-size: 1.4rem; height: 48px; margin-bottom: 14px; place-items: center; width: 48px; }
    h1 { font-size: 1.4rem; margin: 0 0 12px; }
    p { color: #d8cfe0; line-height: 1.6; margin: 0 0 22px; }
    button { background: #f4a8c8; border: 0; border-radius: 10px; color: #2a1723; cursor: pointer; font: inherit; font-weight: 750; padding: 13px 18px; width: 100%; }
    button:hover:not(:disabled) { background: #ffc0da; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    #status { color: #ffb6c8; font-size: .92rem; margin: 18px 0 0; min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🐱</div>
    <h1>냥캣메모 로그인</h1>
    <p>이메일 보안 검사로 링크가 먼저 사용되는 일을 막기 위해, 아래 버튼을 직접 눌러 로그인을 계속합니다.</p>
    <button id="continueButton" type="button" disabled>로그인 계속하기</button>
    <p id="status" role="status"></p>
  </main>
  <script>
    (() => {
      const button = document.getElementById('continueButton');
      const status = document.getElementById('status');
      const rawConfirmationUrl = new URLSearchParams(window.location.search).get('confirmation_url');
      let confirmationUrl;

      // Remove the one-time URL from history before waiting for a deliberate
      // button click. The URL is kept only in this script's closure.
      window.history.replaceState({}, document.title, window.location.pathname);

      try {
        const candidate = new URL(rawConfirmationUrl);
        const redirectTo = new URL(candidate.searchParams.get('redirect_to'));
        const isSupabaseVerification = candidate.protocol === 'https:'
          && candidate.hostname.endsWith('.supabase.co')
          && candidate.pathname === '/auth/v1/verify'
          && candidate.searchParams.get('type') === 'magiclink';
        const returnsToThisSite = redirectTo.origin === window.location.origin
          && redirectTo.pathname === '/'
          && !redirectTo.search
          && !redirectTo.hash;
        if (!isSupabaseVerification || !returnsToThisSite) throw new Error('invalid confirmation URL');
        confirmationUrl = candidate;
        button.disabled = false;
      } catch {
        status.textContent = '로그인 링크를 확인하지 못했습니다. 냥캣메모에서 새 로그인 메일을 요청해주세요.';
      }

      button.addEventListener('click', () => {
        if (!confirmationUrl) return;
        button.disabled = true;
        status.textContent = '로그인을 확인하는 중입니다...';
        window.location.assign(confirmationUrl.href);
      });
    })();
  </script>
</body>
</html>
